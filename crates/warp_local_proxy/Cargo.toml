[package]
name = "warp_local_proxy"
version = "0.1.0"
edition = "2021"
authors.workspace = true
publish.workspace = true
license.workspace = true
description = "Fork-only: local proxy that intercepts Warp client traffic, handles AI ops via an OpenAI-compatible (or Azure) backend, and stubs identity/settings ops with canned data."

[[bin]]
name = "warp-local-proxy"
path = "src/main.rs"

[lib]
name = "warp_local_proxy"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tower.workspace = true
tower-http = { workspace = true, features = ["trace"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
